name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Install Scoop
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Add this bucket and install derbent
        run: |
          scoop bucket add derbent $env:GITHUB_WORKSPACE
          scoop install derbent/derbent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run
        run: derbent version
      - name: Autoupdate reproduces the manifest
        run: |
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App derbent -Dir "$env:GITHUB_WORKSPACE\bucket" -Update -Force
          git -C $env:GITHUB_WORKSPACE diff --exit-code
